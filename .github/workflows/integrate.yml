name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/java-base@v1
      - run: ./gradlew lint
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        platform: [android]
        arch: [arm64, arm, x64, ia32]
        engine: [v8, quickjs]
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }} / ${{ matrix.engine }}
    steps:
      - uses: holepunchto/actions/java-base@v1
      - uses: holepunchto/actions/setup-node@v1
      - uses: holepunchto/actions/install-npm-dependencies@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: -D BARE_KIT_KOTLIN_ENGINE=${{ matrix.engine }}
      - run: ./gradlew assemble -PbareKit.local -PbareKit.engine=${{ matrix.engine }}
  test:
    strategy:
      matrix:
        platform: [linux, darwin, win32]
        arch: [x64, arm64]
        engine: [v8, quickjs]
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}-${{ matrix.arch }} / ${{ matrix.engine }}
    steps:
      - uses: holepunchto/actions/java-base@v1
      - uses: holepunchto/actions/setup-node@v1
      - uses: holepunchto/actions/install-npm-dependencies@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: -D BARE_KIT_KOTLIN_ENGINE=${{ matrix.engine }}
      - run: ./gradlew test -PbareKit.local -PbareKit.engine=${{ matrix.engine }}
        shell: bash
